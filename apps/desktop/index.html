<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/octo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Octo</title>
    <!-- First paint, before any CSS or script bundle: the window colour of the chosen theme (same values as
         --octo-window in packages/ui). Without JS, the media queries follow the system. -->
    <style>
      html { background: #0a0a0a; color-scheme: dark; }
      @media (prefers-color-scheme: light) { html { background: #ececec; color-scheme: light; } }
      html[data-theme="dark"] { background: #0b0b0b; color-scheme: dark; }
      html[data-theme="cursor"] { background: #111113; color-scheme: dark; }
      html[data-theme="claude"] { background: #141311; color-scheme: dark; }
      html[data-theme="codex"] { background: #0d0f12; color-scheme: dark; }
      html[data-theme="opencode"] { background: #0b0b0e; color-scheme: dark; }
      html[data-theme="light"] { background: #f5f5f5; color-scheme: light; }
    </style>
    <!-- A file, not an inline script: the app's Content-Security-Policy (tauri.conf.json) allows scripts from the app only. -->
    <script src="/theme.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
