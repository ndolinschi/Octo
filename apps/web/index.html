<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Octo" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/octo.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-256.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Octo</title>
    <!-- First paint: the window colour of the theme (same values as --octo-window in packages/ui). Inline styles are
         allowed by the harness's CSP; inline scripts are not, hence theme.js. -->
    <style>
      html { background: #0a0a0a; color-scheme: dark; }
      @media (prefers-color-scheme: light) { html { background: #ececec; color-scheme: light; } }
      html[data-theme="dark"] { background: #0b0b0b; color-scheme: dark; }
      html[data-theme="cursor"] { background: #111113; color-scheme: dark; }
      html[data-theme="claude"] { background: #141311; color-scheme: dark; }
      html[data-theme="codex"] { background: #0d0f12; color-scheme: dark; }
      html[data-theme="opencode"] { background: #0b0b0e; color-scheme: dark; }
      html[data-theme="light"] { background: #f5f5f5; color-scheme: light; }
    </style>
    <script src="/theme.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
