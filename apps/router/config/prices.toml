# USD-per-1M-token rates per model.
#
# Since 2026-11-14 the router refreshes prices from the OpenRouter catalogue itself
# (https://openrouter.ai/api/v1/models; at start, then every 6 h; cached beside the history
# database). Precedence per model: a row marked `source = "manual"` > the catalogue > a row
# without the marker (a fallback, used when the catalogue has no price or is off) > none.
# See docs/prices.md.
#
# Refresh settings (all optional; uncomment to change):
# [prices]
# refresh = "catalogue"          # or "off"; default: on when every OpenRouter URL is openrouter.ai,
#                                # off for a mock/proxy upstream. OCTO_PRICES_REFRESH=off|catalogue wins.
# refresh_interval_secs = 21600  # jittered by +-10%
# cache_file = ""                # default: prices-catalogue.json beside history.database_path
#
# A manual override (always wins over the catalogue):
# [prices."vendor/model"]
# source = "manual"
# input = 1.0
# cache_read = 0.1
# cache_write = 0.0
# output = 2.0
#
# Estimate is used only when ALL four rates (input, cache_read, cache_write, output)
# are present AND at least one rate is > 0. All-zero rows skip estimate and fall through
# to upstream / OpenRouter / none. Partial rows also fall through.
# Fallback rows below were last copied from https://openrouter.ai/api/v1/models on 2026-11-14 (see docs/ladder-cost-check.md).
# cache_write stays 0.0 where the catalogue publishes no cache-write price.
# billed_as maps Octo/OpenRouter slug -> provider invoice name for reconcile_costs.py.

# Small cheap tool-calling models; rates from https://openrouter.ai/api/v1/models on 2026-11-13.
[prices."meta-llama/llama-3.1-8b-instruct"]
input = 0.02
cache_read = 0.0
cache_write = 0.0
output = 0.04
# billed_as = "llama-3.1-8b-instruct"

