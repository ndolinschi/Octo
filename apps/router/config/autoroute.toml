[autoroute]
# Model slugs used by /autoroute when JEV picks a complexity band.
# OpenRouter ladder (cheaper sweep): nemo → small-3.2 → deepseek-v4-flash.
low = "mistralai/mistral-nemo"
mid = "mistralai/mistral-small-3.2-24b-instruct"
high = "deepseek/deepseek-v4-flash"
hard_threshold = 0.5
easy_threshold = 0.5

# Stall detection looks at the last N non-housekeeping assistant turns / tool_use blocks.
stall_window = 6
# After a stall, stay one tier higher for this many subsequent requests.
escalate_turns = 3
# Consecutive lower classifications required before stepping the sticky tier down.
down_confirm = 2
# Client model is honoured on High only when its slug (tilde-insensitive) is listed here.
# Empty means always use the configured high slug.
high_allow = []
# Session spend cap in USD (0 = disabled). Counts JEV + LLM cost_micros for the session key.
session_budget_usd = 0
# Keep this many recent messages when trimming housekeeping turns (system + tools always kept).
housekeeping_keep_messages = 6
# Empty: global provider_order would mis-route non-Mistral high tier (DeepSeek).
provider_order = []
allow_fallbacks = true

# Top-level Anthropic-only keys removed before OpenRouter (Filter by Parameters).
# Proven against supported_parameters for high-tier models (see experiments in docs/).
# Empty list disables stripping. Protected keys (tools, tool_choice, system, messages,
# max_tokens, stop_sequences, metadata) are ignored if listed.
# With require_parameters=always, narrowing this list can reintroduce OpenRouter 404s.
strip_fields = ["output_config", "safeguards", "context_management"]
# OpenRouter provider.require_parameters: always | tools_only | never (invalid values fail config load)
require_parameters = "always"
# Observe-only: client model substring match → calls.bg_signal (case-insensitive).
background_model_patterns = ["haiku"]
# When true, bg_signal requests (except permission_check) route like housekeeping with
# trigger background_model. Default false = no routing change.
background_by_client_model = false
# Server tools (web_search / web_fetch / code_execution): passthrough | online_suffix | reject.
server_tool_mode = "passthrough"
