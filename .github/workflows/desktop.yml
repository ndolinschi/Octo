name: desktop
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc --noEmit && eslint in @octo/agent-client, @octo/ui and @octo/desktop
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @octo/agent-client test
      - run: pnpm --filter @octo/ui test
      - run: pnpm --filter @octo/desktop test
      # The mobile web client (the root `test` and `build` scripts do not include it)
      - run: pnpm --filter @octo/web test
      # layer-imports ESLint rule (import cycles are checked by `pnpm lint`)
      - run: pnpm test:scripts
      - run: pnpm --filter @octo/desktop build
      - run: pnpm --filter @octo/web build
      # Initial JS (gzip) must stay within the budget recorded in the script.
      - run: node scripts/check-bundle-size.mjs

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Tauri shell embeds the built frontend; the checks themselves run in the `frontend` job.
      - run: pnpm --filter @octo/desktop build
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0 (branch)
        with:
          toolchain: 1.90.0 # pinned by SHA, the action no longer reads the version from its ref
      # tauri-build requires every bundle.externalBin file (harness and the octo router) to exist; the real ones are
      # built by scripts/build-sidecar.sh.
      - name: Placeholder sidecars for cargo check
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p apps/desktop/src-tauri/binaries
          touch "apps/desktop/src-tauri/binaries/harness-$triple"
          touch "apps/desktop/src-tauri/binaries/octo-$triple"
          # bundle.resources lists apps/web/dist, which must exist too (the frontend job builds the real one).
          mkdir -p apps/web/dist
      - working-directory: apps/desktop/src-tauri
        run: cargo check
      - working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - working-directory: apps/desktop/src-tauri
        run: cargo clippy -p octo-sidecar --all-targets -- -D warnings
      # Needs WebKitGTK, which was not available where this was written: the shell crate's clippy is unverified.
      - working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings
      # Port choice, login-shell PATH parsing, health wait, log cap, process-group shutdown, harness.env parsing and the
      # two-sidecar start order with fake binaries (router off / on / failing, shutdown order, restart) - no WebKit needed.
      - working-directory: apps/desktop/src-tauri
        run: cargo test -p octo-sidecar
