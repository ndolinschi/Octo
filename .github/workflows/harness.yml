name: harness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/harness/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/octo-harness ./cmd/harness

  # The scripted end-to-end checks (curl against a real `harness serve`; mock model, scripted ACP agent) and the
  # dev.sh check. A separate job so the checks above stay fast. Ports are picked free by the scripts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/harness/go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # 1.90.0 (branch)
        with:
          toolchain: 1.90.0 # pinned by SHA, the action no longer reads the version from its ref
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pnpm install --frozen-lockfile
      - name: Sidecars (harness and router, release)
        run: bash scripts/build-sidecar.sh
      # e2e-router.sh runs target/debug/octo
      - run: cargo build -p octo
      - run: bash apps/harness/scripts/e2e-acp-orchestrator.sh
      - run: bash apps/harness/scripts/e2e-router.sh
      - run: bash apps/harness/scripts/e2e-v7.sh
      - run: pnpm test:dev-sh
      - run: pnpm test:dev-sh -- --router --mock
